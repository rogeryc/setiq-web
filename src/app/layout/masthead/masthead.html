<header class="s-mast">
  <span class="s-mark">setiq<em>.</em></span>
  <div class="s-tenant-wrap">
    <button class="s-tenant"
            type="button"
            [class.single]="!canSwitchTenant()"
            [disabled]="switching()"
            (click)="toggleTenantMenu()">
      <span class="dot"></span>{{ tenantLabel() }}
      @if (canSwitchTenant()) {
        <app-icon name="chevron-down" [size]="12" />
      }
    </button>
    @if (tenantMenuOpen()) {
      <div class="s-tenant-menu" role="menu">
        <span class="s-tenant-menu-head">Cambiar inquilino</span>
        @for (t of availableTenants(); track t.id) {
          <button type="button"
                  class="s-tenant-menu-item"
                  [class.active]="t.id === currentTenantId()"
                  (click)="pickTenant(t.id)">
            <strong>{{ t.name }}</strong>
            <span>{{ t.role }}</span>
            @if (t.id === currentTenantId()) { <span class="s-tenant-menu-check">✓</span> }
          </button>
        }
      </div>
    }
  </div>
  <div class="s-mast-spacer"></div>
  <div class="s-mast-meta">
    <span [title]="'Hora local Bolivia. Datos al cargar la página.'">{{ nowLabel() }}</span>
    <button class="s-search" type="button" (click)="sp.open()">
      <app-icon name="search" [size]="14" />
      <span>Buscar conversaciones, segmentos…</span>
      <kbd>⌘K</kbd>
    </button>
    <div class="s-mast-user">
      <button class="s-avatar" type="button" aria-label="Cuenta" (click)="toggleMenu()">{{ userInitials() }}</button>
      @if (menuOpen()) {
        <div class="s-mast-menu" role="menu">
          <div class="s-mast-menu-head">
            <strong>{{ userName() || 'Usuario' }}</strong>
            <span>{{ userEmail() }}</span>
          </div>
          <button type="button" (click)="logout()">Cerrar sesión</button>
        </div>
      }
    </div>
    <button type="button" class="s-btn ghost" style="padding:6px 10px"
            title="Cambiar tema" (click)="theme.toggle()">
      <app-icon name="theme" [size]="14" />
    </button>
  </div>
  <app-search-palette #sp />
</header>
