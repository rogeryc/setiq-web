<div class="login-shell">
  <form class="login-card" (ngSubmit)="submit()" autocomplete="on">
    <div class="login-brand">
      <span class="s-mark">SET<em>IQ</em></span>
      <span class="caps muted">Inicio de sesión</span>
    </div>

    <label class="login-field">
      <span>Correo electrónico</span>
      <input
        class="s-input"
        type="email"
        name="email"
        autocomplete="username"
        required
        [ngModel]="email()"
        (ngModelChange)="email.set($event)"
        [disabled]="submitting()"
      />
    </label>

    <label class="login-field">
      <span>Contraseña</span>
      <input
        class="s-input"
        type="password"
        name="password"
        autocomplete="current-password"
        required
        [ngModel]="password()"
        (ngModelChange)="password.set($event)"
        [disabled]="submitting()"
      />
    </label>

    <label class="login-remember">
      <input
        type="checkbox"
        [checked]="rememberMe()"
        (change)="rememberMe.set($any($event.target).checked)"
        [disabled]="submitting()"
      />
      <span>Recordarme en este equipo</span>
    </label>

    @if (error(); as err) {
      <div class="login-error" role="alert">{{ err }}</div>
    }

    <button type="submit" class="s-btn acc login-submit" [disabled]="submitting()">
      {{ submitting() ? 'Entrando…' : 'Entrar' }}
    </button>

    <p class="login-foot">¿Problemas para entrar? Escribinos a <a href="mailto:soporte@setiq.bo">soporte&#64;setiq.bo</a>.</p>
  </form>
</div>
